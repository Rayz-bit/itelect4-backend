name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # node_modules is in .gitignore, so install exactly what package-lock.json lists
      - run: npm ci

      - run: npm run typecheck

      # .env is not in the repo, so JWT_SECRET comes from the repository secret
      - run: npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
